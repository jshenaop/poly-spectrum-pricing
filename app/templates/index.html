<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valoración de Espectro por Polígono — ANE</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>

  <style>
    /* ── GovCo Kit UI 9.2 — Paleta ANE/azules ───────────────── */
    :root {
      --blue-primary:  #3366CC;
      --blue-dark:     #004884;
      --blue-darker:   #003366;
      --blue-light:    #E8F0FD;
      --blue-mid:      #006EB5;
      --govco-black:   #000000;
      --govco-gray-lt: #F2F2F2;
      --govco-gray:    #CCCCCC;
      --govco-gray-dk: #767676;
      --govco-text:    #404040;
      --govco-white:   #FFFFFF;
      --pre-h:  48px;
      --inst-h: 88px;
      --nav-h:  46px;
      --sidebar: 420px;
      --font: 'Montserrat', system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--govco-gray-lt);
      color: var(--govco-text);
      display: flex;
      flex-direction: column;
      font-size: 14px;
      overflow: hidden;
    }

    /* ── Barra superior de accesibilidad (pre-header) ─────────── */
    .pre-header {
      height: var(--pre-h);
      background: var(--blue-primary);
      display: flex;
      align-items: center;
      padding: 0 3rem;
      justify-content: flex-start;
      flex-shrink: 0;
    }
    .pre-header-brand img {
      height: 28px;
      width: auto;
      display: block;
    }

    /* ── Header institucional ─────────────────────────────────── */
    .inst-header {
      height: var(--inst-h);
      background: var(--govco-white);
      border-bottom: 1px solid var(--govco-gray);
      display: flex;
      align-items: center;
      padding: 0 2rem;
      gap: 1.25rem;
      flex-shrink: 0;
    }
    .logo-ane {
      height: 68px;
      flex-shrink: 0;
    }
    .inst-divider {
      width: 1px;
      height: 56px;
      background: var(--govco-gray);
      flex-shrink: 0;
    }
    .inst-entity h1 {
      font-size: 15px;
      font-weight: 700;
      color: var(--blue-dark);
      line-height: 1.35;
    }
    .inst-entity p {
      font-size: 11px;
      color: var(--govco-gray-dk);
      margin-top: 3px;
      font-weight: 400;
    }

    /* ── Barra de navegación ──────────────────────────────────── */
    .nav-bar {
      height: var(--nav-h);
      background: var(--blue-primary);
      display: flex;
      align-items: center;
      padding: 0 2rem;
      gap: 1rem;
      flex-shrink: 0;
    }
    .nav-title {
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .03em;
    }
    .nav-badge {
      margin-left: auto;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      letter-spacing: .04em;
    }

    /* ── Layout principal ─────────────────────────────────────── */
    .workspace {
      display: grid;
      grid-template-columns: var(--sidebar) 1fr;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Barra lateral ────────────────────────────────────────── */
    aside {
      background: var(--govco-white);
      border-right: 3px solid var(--blue-primary);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      min-height: 0;
    }
    .aside-section { padding: 1.5rem 1.25rem 0; }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--blue-primary);
      margin-bottom: 1rem;
      padding-bottom: .5rem;
      border-bottom: 2px solid var(--blue-light);
    }

    /* ── Formulario ───────────────────────────────────────────── */
    .field { margin-bottom: 1rem; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--govco-text);
      margin-bottom: .4rem;
    }
    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: .6rem .75rem;
      background: var(--govco-white);
      border: 1px solid #ADADAD;
      border-radius: 4px;
      color: var(--govco-text);
      font-size: 13px;
      font-family: var(--font);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus {
      border-color: var(--blue-primary);
      box-shadow: 0 0 0 3px rgba(51,102,204,.18);
    }
    select option { background: var(--govco-white); color: var(--govco-text); }
    .coords {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: .6rem;
    }
    .p-radius {
      padding: 0.45rem 0.4rem;
      border: 1px solid var(--govco-gray);
      border-radius: 4px;
      font-family: var(--font);
      font-size: 13px;
      background: var(--govco-white);
      color: var(--govco-text);
      width: 100%;
    }

    /* ── Botones ──────────────────────────────────────────────── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      width: 100%;
      padding: .7rem 1rem;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      transition: background .15s, color .15s;
      letter-spacing: .03em;
    }
    .btn-primary { background: var(--blue-primary); color: #fff; }
    .btn-primary:hover { background: var(--blue-dark); }
    .btn-primary.htmx-request { opacity: .65; pointer-events: none; }

    .btn-secondary {
      background: var(--govco-white);
      color: var(--blue-primary);
      border: 1.5px solid var(--blue-primary);
      margin-top: .6rem;
      text-decoration: none;
    }
    .btn-secondary:hover { background: var(--blue-light); }

    /* ── Separador ────────────────────────────────────────────── */
    .divider { height: 1px; background: var(--govco-gray); margin: 1.25rem 0; }

    /* ── Panel de métricas ────────────────────────────────────── */
    #metrics { flex: 1; padding: 0 1.25rem 1.25rem; }
    .metric-empty {
      color: var(--govco-gray-dk);
      font-size: 12px;
      text-align: center;
      padding: 2rem 0;
      line-height: 1.6;
    }
    .metric-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: .75rem;
      margin-bottom: 1rem;
    }
    .metric-card {
      background: var(--govco-gray-lt);
      border: 1px solid var(--govco-gray);
      border-left: 3px solid var(--blue-primary);
      border-radius: 4px;
      padding: .9rem 1rem;
      min-height: 4rem;
    }
    .metric-card.full { grid-column: 1 / -1; border-left-color: var(--blue-dark); }
    .metric-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--govco-gray-dk);
      margin-bottom: .45rem;
      text-transform: uppercase;
      letter-spacing: .07em;
    }
    .metric-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--govco-text);
      line-height: 1.2;
      word-break: break-all;
    }
    .metric-value.blue { color: var(--blue-dark); }
    .metric-note {
      font-size: 10px;
      color: var(--govco-gray-dk);
      margin-top: .4rem;
      line-height: 1.5;
    }

    #download-link { display: none; }
    #download-link.visible { display: flex; }

    /* ── Área del mapa ────────────────────────────────────────── */
    #map-area { position: relative; background: #d0e2f5; min-height: 0; }
    #map-container { width: 100%; height: 100%; }
    #map-container > div,
    #map-container iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
    }
    #map-spinner {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(208,226,245,.75);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #map-spinner.visible { display: flex; }
    .spinner-ring {
      width: 38px; height: 38px;
      border: 3px solid var(--govco-gray);
      border-top-color: var(--blue-primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Tab bar móvil ───────────────────────────────────────── */
    .mobile-tabs { display: none; }

    .tab-btn {
      flex: 1;
      padding: .65rem .5rem;
      border: none;
      background: transparent;
      color: var(--govco-gray-dk);
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      border-bottom: 3px solid transparent;
      transition: color .15s, border-color .15s;
      letter-spacing: .02em;
    }
    .tab-btn.active {
      color: var(--blue-primary);
      border-bottom-color: var(--blue-primary);
    }

    /* ── Responsive móvil ────────────────────────────────────── */
    @media (max-width: 768px) {

      /* Body: permitir scroll en móvil */
      body { overflow: auto; }

      /* Pre-header: solo branding */
      .pre-header { padding: 0 1rem; }

      /* Header institucional compacto */
      .inst-header { padding: 0 1rem; gap: .75rem; height: 62px; }
      .logo-ane    { height: 44px; }
      .inst-entity h1 { font-size: 12px; }
      .inst-entity p  { display: none; }
      .inst-divider   { height: 36px; }

      /* Nav-bar: sin badge */
      .nav-bar  { padding: 0 1rem; height: 42px; }
      .nav-badge { display: none; }
      .nav-title { font-size: 11px; }

      /* Mostrar tab bar */
      .mobile-tabs {
        display: flex;
        background: var(--govco-white);
        border-bottom: 2px solid var(--govco-gray);
        flex-shrink: 0;
      }

      /* Workspace: bloque simple, un panel a la vez */
      .workspace {
        display: block;
        flex: initial;
        height: auto;
        overflow: visible;
      }

      /* Sidebar: ancho completo, sin borde derecho */
      aside {
        min-height: 0;
        overflow-y: visible;
        border-right: none;
        border-bottom: 2px solid var(--govco-gray);
        width: 100%;
      }

      /* Mapa: altura fija para que llene la pantalla */
      #map-area { height: 75vh; }

      /* Panel oculto por tab */
      .mobile-hidden { display: none !important; }

      /* Métricas sin padding lateral en móvil */
      #metrics { padding: 0 1rem 1rem; }
      .aside-section { padding: 1rem 1rem 0; }
      #download-link.visible + div,
      div:has(> #download-link) { padding: 0 1rem 1rem; }
    }
    /* ── Multi-point UI ───────────────────────────────────── */
    .point-row {
      position: relative;
      border: 1px solid var(--govco-light-blue);
      border-radius: 6px;
      padding: 0.6rem 0.75rem 0.5rem;
      margin-bottom: 0.5rem;
      background: #f8fbff;
    }
    .point-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--govco-primary);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .btn-danger-sm {
      position: absolute;
      top: 0.45rem;
      right: 0.5rem;
      background: none;
      border: none;
      color: #c0392b;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.1rem 0.3rem;
      line-height: 1;
    }
    .btn-danger-sm:hover { color: #922b21; }
    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
    .min-applied-badge {
      display: inline-block;
      background: #f39c12;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      vertical-align: middle;
      margin-left: 0.4rem;
      text-transform: uppercase;
    }
    .max-pts-warning {
      font-size: 0.78rem;
      color: #856404;
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 4px;
      padding: 0.4rem 0.6rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- ── Barra superior de accesibilidad (GovCo) ──────────── -->
  <div class="pre-header">
    <div class="pre-header-brand">
      <img src="/static/img/logo-govco.png"
           alt="gov.co — Portal oficial del Estado colombiano">
    </div>
  </div>

  <!-- ── Header institucional ANE ─────────────────────────── -->
  <header class="inst-header">
    <img src="/static/img/logo-ane.png"
         alt="Agencia Nacional del Espectro"
         class="logo-ane">
    <div class="inst-divider" aria-hidden="true"></div>
    <div class="inst-entity">
      <h1>Agencia Nacional del Espectro</h1>
      <p>República de Colombia</p>
    </div>
  </header>

  <!-- ── Barra de navegación ───────────────────────────────── -->
  <nav class="nav-bar" aria-label="Aplicación">
    <span class="nav-title">Valoración de Espectro por Polígono</span>
    <span class="nav-badge">GeoSight V2.0</span>
  </nav>

  <!-- ── Tab bar (solo visible en móvil) ─────────────────────── -->
  <div class="mobile-tabs" role="tablist" aria-label="Paneles">
    <button class="tab-btn active" data-tab="form"
            onclick="showTab('form')" role="tab" aria-selected="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5">
        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
      Consulta
    </button>
    <button class="tab-btn" data-tab="map"
            onclick="showTab('map')" role="tab" aria-selected="false">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5">
        <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
        <line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/>
      </svg>
      Mapa
    </button>
  </div>

  <!-- ── Workspace ─────────────────────────────────────────── -->
  <div class="workspace" id="contenido-principal">

    <!-- ── Sidebar ──────────────────────────────────────────── -->
    <aside id="menu-lateral">
      <div class="aside-section">
        <p class="section-title">Consulta</p>

        <form id="assignment-form">

          <div class="field">
            <label for="f-name">Nombre del proyecto</label>
            <input id="f-name" type="text" name="name"
                   value="Proyecto 1" required autocomplete="off">
          </div>

          <div class="field">
            <label>Coordenadas <span style="font-weight:400;color:var(--govco-gray-dark)">(máx. 3 en UI)</span></label>
            <div id="points-list"></div>
            <button type="button" class="btn btn-secondary btn-sm" id="add-point-btn"
                    onclick="addPoint()" style="margin-top:0.5rem;">
              + Agregar punto
            </button>
            <p id="max-pts-msg" class="max-pts-warning" style="display:none;">
              Para más de 3 coordenadas, utilice el endpoint API /assignments.
            </p>
          </div>

          <button type="submit" class="btn btn-primary" id="calc-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            Calcular cobertura
          </button>

        </form>
      </div>

      <div class="divider"></div>

      <!-- ── Métricas ──────────────────────────────────────── -->
      <div id="metrics">
        <p class="metric-empty">
          Complete el formulario y presione<br>
          <strong>Calcular cobertura</strong> para ver los resultados.
        </p>
      </div>

      <!-- Descarga CSV -->
      <div style="padding: 0 1.25rem 1.5rem;">
        <a id="download-link" href="/v2/export/csv"
           class="btn btn-secondary" download>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Descargar CSV
        </a>
      </div>
    </aside>

    <!-- ── Mapa ──────────────────────────────────────────────── -->
    <div id="map-area">
      <div id="map-spinner">
        <div class="spinner-ring"></div>
      </div>
      <div id="map-container">
        <iframe src="/map?lat=4.71099&lng=-74.07209&radius_km=8.2"
                id="map-iframe" style="border:none;" title="Mapa de cobertura"></iframe>
      </div>
    </div>

  </div><!-- .workspace -->

  <script>
    /* ── Formato COP ─────────────────────────────────────────── */
    function copFormat(n) {
      return '$\u00a0' + Math.round(n).toLocaleString('de-DE');
    }

    /* ── Tab móvil ───────────────────────────────────────────── */
    function showTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => {
        const active = b.dataset.tab === tab;
        b.classList.toggle('active', active);
        b.setAttribute('aria-selected', active);
      });
      document.getElementById('menu-lateral')
        .classList.toggle('mobile-hidden', tab !== 'form');
      document.getElementById('map-area')
        .classList.toggle('mobile-hidden', tab !== 'map');
    }

    /* ── Gestión de puntos ───────────────────────────────────── */
    const MAX_UI_POINTS = 3;
    const DEFAULT_POINTS = [{ lat: '4.71099', lng: '-74.07209' }];

    function getPoints() {
      return Array.from(document.querySelectorAll('.point-row')).map(row => ({
        lat: parseFloat(row.querySelector('.p-lat').value),
        lng: parseFloat(row.querySelector('.p-lng').value),
        radius_km: parseFloat(row.querySelector('.p-radius').value),
      }));
    }

    function updateAddBtn() {
      const count = document.querySelectorAll('.point-row').length;
      const btn   = document.getElementById('add-point-btn');
      const msg   = document.getElementById('max-pts-msg');
      btn.disabled = count >= MAX_UI_POINTS;
      btn.style.opacity = count >= MAX_UI_POINTS ? '0.4' : '1';
      msg.style.display = count >= MAX_UI_POINTS ? 'block' : 'none';
    }

    function addPoint(lat, lng, radius) {
      const list  = document.getElementById('points-list');
      const index = list.children.length + 1;
      /* Inherit from last point if no explicit values given */
      if (!lat && !lng && index > 1) {
        const lastRow = list.children[list.children.length - 1];
        lat = lastRow.querySelector('.p-lat').value;
        lng = lastRow.querySelector('.p-lng').value;
        radius = lastRow.querySelector('.p-radius').value;
      }
      const row   = document.createElement('div');
      row.className = 'point-row';
      const selRadius = radius || '8.2';
      row.innerHTML = `
        <span class="point-label">Punto ${index}</span>
        <div class="coords">
          <div class="field">
            <label>Latitud</label>
            <input type="number" class="p-lat" step="0.00001"
                   value="${lat || ''}" placeholder="4.71099" required>
          </div>
          <div class="field">
            <label>Longitud</label>
            <input type="number" class="p-lng" step="0.00001"
                   value="${lng || ''}" placeholder="-74.07209" required>
          </div>
          <div class="field">
            <label>Radio</label>
            <select class="p-radius">
              <option value="8.2"${selRadius === '8.2' ? ' selected' : ''}>8.2 km</option>
              <option value="21.9"${selRadius === '21.9' ? ' selected' : ''}>21.9 km</option>
              <option value="35.8"${selRadius === '35.8' ? ' selected' : ''}>35.8 km</option>
            </select>
          </div>
        </div>
        ${index > 1 ? `<button type="button" class="btn-danger-sm" onclick="removePoint(this)" title="Eliminar punto">✕</button>` : ''}
      `;
      list.appendChild(row);
      updateAddBtn();
    }

    function removePoint(btn) {
      btn.closest('.point-row').remove();
      /* Re-numerar etiquetas */
      document.querySelectorAll('.point-row .point-label').forEach((lbl, i) => {
        lbl.textContent = `Punto ${i + 1}`;
      });
      updateAddBtn();
    }

    /* Inicializar con el primer punto por defecto */
    DEFAULT_POINTS.forEach(p => addPoint(p.lat, p.lng));

    /* ── Envío del formulario ────────────────────────────────── */
    document.getElementById('assignment-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const points = getPoints();
      const nombre = document.getElementById('f-name').value;

      document.getElementById('map-spinner').style.display = 'flex';

      try {
        const res = await fetch('/v2/assignments/multi', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ points }),
        });

        if (!res.ok) {
          const err = await res.json();
          alert(err.detail || 'Error al calcular cobertura.');
          return;
        }

        const data = await res.json();
        renderResults(data, points, nombre);
        if (window.innerWidth <= 768) showTab('map');
      } catch (err) {
        alert('Error de red: ' + err.message);
      } finally {
        document.getElementById('map-spinner').style.display = 'none';
      }
    });

    /* ── Renderizado de resultados ───────────────────────────── */
    function renderResults(data, points, nombre) {
      const minBadge = data.min_applied
        ? `<span class="min-applied-badge">Piso aplicado</span>` : '';

      const dedupLine = data.deduplication_adjustment > 0.01
        ? `<p class="metric-note" style="padding:0 1.25rem;">
             Ajuste por solapamiento: −${copFormat(data.deduplication_adjustment)}
           </p>` : '';

      document.getElementById('metrics').innerHTML = `
        <div style="padding:0 1.25rem 0;">
          <p class="section-title">Resultado ${data.points_count > 1 ? `(${data.points_count} puntos)` : ''}</p>
          <div class="metric-grid">
            <div class="metric-card full">
              <div class="metric-label">Total COP / MHz / Año ${minBadge}</div>
              <div class="metric-value blue">${copFormat(data.total)}</div>
              <div class="metric-note">
                ${data.points_count > 1 ? 'Unión de coberturas con deduplicación.' : 'Cobertura individual.'}
              </div>
            </div>
            <div class="metric-card full">
              <div class="metric-label">Población cubierta</div>
              <div class="metric-value blue">${data.population_covered.toLocaleString('de-DE')}</div>
              <div class="metric-note">${data.polygon_count} polígonos evaluados</div>
            </div>
          </div>
          ${dedupLine}
        </div>`;

      const mapContainer = document.getElementById('map-container');
      mapContainer.innerHTML = '';
      const sandboxFrame = document.createElement('iframe');
      sandboxFrame.setAttribute('sandbox', 'allow-scripts');
      sandboxFrame.srcdoc = data.map_html;
      sandboxFrame.style.cssText = 'width:100%;height:100%;border:none;';
      mapContainer.appendChild(sandboxFrame);

      /* CSV solo disponible para punto único */
      const dl = document.getElementById('download-link');
      if (points.length === 1) {
        const params = new URLSearchParams({
          name: nombre,
          lat: points[0].lat,
          lng: points[0].lng,
          radius_km: points[0].radius_km,
        });
        dl.href = `/v2/export/csv?${params}`;
        dl.classList.add('visible');
      } else {
        dl.classList.remove('visible');
      }
    }
  </script>

</body>
</html>
