<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traslape entre Proponentes — ANE</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue-primary:  #3366CC;
      --blue-dark:     #004884;
      --blue-darker:   #003366;
      --blue-light:    #E8F0FD;
      --blue-mid:      #006EB5;
      --govco-black:   #000000;
      --govco-gray-lt: #F2F2F2;
      --govco-gray:    #CCCCCC;
      --govco-gray-dk: #767676;
      --govco-text:    #404040;
      --govco-white:   #FFFFFF;
      --pre-h:  48px;
      --inst-h: 88px;
      --nav-h:  46px;
      --sidebar: 420px;
      --font: 'Montserrat', system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--govco-gray-lt);
      color: var(--govco-text);
      display: flex;
      flex-direction: column;
      font-size: 14px;
      overflow: hidden;
    }

    .pre-header {
      height: var(--pre-h);
      background: var(--blue-primary);
      display: flex;
      align-items: center;
      padding: 0 3rem;
      justify-content: flex-start;
      flex-shrink: 0;
    }
    .pre-header-brand img { height: 28px; width: auto; display: block; }

    .inst-header {
      height: var(--inst-h);
      background: var(--govco-white);
      border-bottom: 1px solid var(--govco-gray);
      display: flex;
      align-items: center;
      padding: 0 2rem;
      gap: 1.25rem;
      flex-shrink: 0;
    }
    .logo-ane { height: 68px; flex-shrink: 0; }
    .inst-divider { width: 1px; height: 56px; background: var(--govco-gray); flex-shrink: 0; }
    .inst-entity h1 { font-size: 15px; font-weight: 700; color: var(--blue-dark); line-height: 1.35; }
    .inst-entity p { font-size: 11px; color: var(--govco-gray-dk); margin-top: 3px; font-weight: 400; }

    .nav-bar {
      height: var(--nav-h);
      background: var(--blue-primary);
      display: flex;
      align-items: center;
      padding: 0 2rem;
      gap: 1rem;
      flex-shrink: 0;
    }
    .nav-title { color: #fff; font-size: 13px; font-weight: 600; letter-spacing: .03em; }
    .nav-badge {
      margin-left: auto;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      letter-spacing: .04em;
    }
    .nav-link {
      color: rgba(255,255,255,.85);
      font-size: 12px;
      text-decoration: none;
      font-weight: 500;
    }
    .nav-link:hover { color: #fff; }

    .workspace {
      display: grid;
      grid-template-columns: var(--sidebar) 1fr;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    aside {
      background: var(--govco-white);
      border-right: 3px solid var(--blue-primary);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      min-height: 0;
    }
    .aside-section { padding: 1.5rem 1.25rem 0; }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--blue-primary);
      margin-bottom: 1rem;
      padding-bottom: .5rem;
      border-bottom: 2px solid var(--blue-light);
    }

    .field { margin-bottom: 1rem; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--govco-text);
      margin-bottom: .4rem;
    }
    input[type="number"],
    select {
      width: 100%;
      padding: .6rem .75rem;
      background: var(--govco-white);
      border: 1px solid #ADADAD;
      border-radius: 4px;
      color: var(--govco-text);
      font-size: 13px;
      font-family: var(--font);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus {
      border-color: var(--blue-primary);
      box-shadow: 0 0 0 3px rgba(51,102,204,.18);
    }

    .proponent-block {
      border: 1px solid var(--govco-gray);
      border-radius: 6px;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      background: #f8fbff;
    }
    .proponent-block.b { background: #fdf8f4; border-color: #e0c9b3; }
    .proponent-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 0.6rem;
      color: var(--blue-dark);
    }
    .proponent-block.b .proponent-label { color: #8B4513; }
    .coords {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .6rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      width: 100%;
      padding: .7rem 1rem;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      transition: background .15s, color .15s;
      letter-spacing: .03em;
    }
    .btn-primary { background: var(--blue-primary); color: #fff; }
    .btn-primary:hover { background: var(--blue-dark); }
    .btn-primary:disabled { opacity: .5; pointer-events: none; }

    .divider { height: 1px; background: var(--govco-gray); margin: 1.25rem 0; }

    #metrics { flex: 1; padding: 0 1.25rem 1.25rem; }
    .metric-empty {
      color: var(--govco-gray-dk);
      font-size: 12px;
      text-align: center;
      padding: 2rem 0;
      line-height: 1.6;
    }
    .metric-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: .75rem;
      margin-bottom: 1rem;
    }
    .metric-card {
      background: var(--govco-gray-lt);
      border: 1px solid var(--govco-gray);
      border-left: 3px solid var(--blue-primary);
      border-radius: 4px;
      padding: .9rem 1rem;
      min-height: 4rem;
    }
    .metric-card.overlap-card { border-left-color: #555555; }
    .metric-card.proponent-a { border-left-color: var(--blue-dark); }
    .metric-card.proponent-b { border-left-color: #8B4513; }
    .metric-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--govco-gray-dk);
      margin-bottom: .45rem;
      text-transform: uppercase;
      letter-spacing: .07em;
    }
    .metric-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--govco-text);
      line-height: 1.2;
      word-break: break-all;
    }
    .metric-value.blue { color: var(--blue-dark); }
    .metric-note {
      font-size: 10px;
      color: var(--govco-gray-dk);
      margin-top: .4rem;
      line-height: 1.5;
    }

    #map-area { position: relative; background: #d0e2f5; min-height: 0; display: flex; flex-direction: column; }

    .map-tabs {
      display: flex;
      background: var(--govco-white);
      border-bottom: 2px solid var(--govco-gray);
      flex-shrink: 0;
    }
    .map-tab {
      flex: 1;
      padding: .65rem .5rem;
      border: none;
      background: transparent;
      color: var(--govco-gray-dk);
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      border-bottom: 3px solid transparent;
      transition: color .15s, border-color .15s;
      letter-spacing: .02em;
    }
    .map-tab.active {
      color: var(--blue-primary);
      border-bottom-color: var(--blue-primary);
    }

    #map-container { flex: 1; min-height: 0; }
    #map-container iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
    }
    #map-spinner {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(208,226,245,.75);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #map-spinner.visible { display: flex; }
    .spinner-ring {
      width: 38px; height: 38px;
      border: 3px solid var(--govco-gray);
      border-top-color: var(--blue-primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .no-overlap-msg {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      padding: 0.6rem 0.8rem;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
    }

    .coord-row {
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 0.6rem;
      margin-bottom: 0.5rem;
      background: rgba(255,255,255,0.7);
    }
    .coord-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .coord-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--govco-gray-dk);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .btn-remove {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1px solid #ccc; background: #fff; color: #999;
      font-size: 14px; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
    }
    .btn-remove:hover { border-color: #e74c3c; color: #e74c3c; background: #fdf0ef; }
    .add-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.4rem;
    }
    .btn-add {
      display: flex; align-items: center; gap: .35rem;
      padding: .4rem .7rem; border: 1px dashed var(--blue-primary);
      border-radius: 4px; background: transparent;
      color: var(--blue-primary); font-size: 11px;
      font-weight: 600; font-family: var(--font);
      cursor: pointer;
    }
    .btn-add:hover { background: var(--blue-light); }
    .btn-add:disabled { opacity: .4; cursor: not-allowed; }
    .counter {
      font-size: 10px; color: var(--govco-gray-dk); font-weight: 500;
    }

    @media (max-width: 768px) {
      body { overflow: auto; }
      .pre-header { padding: 0 1rem; }
      .inst-header { padding: 0 1rem; gap: .75rem; height: 62px; }
      .logo-ane { height: 44px; }
      .inst-entity h1 { font-size: 12px; }
      .inst-entity p { display: none; }
      .inst-divider { height: 36px; }
      .nav-bar { padding: 0 1rem; height: 42px; }
      .nav-badge { display: none; }
      .nav-title { font-size: 11px; }
      .workspace { display: block; flex: initial; height: auto; overflow: visible; }
      aside { overflow-y: visible; border-right: none; border-bottom: 2px solid var(--govco-gray); width: 100%; }
      #map-area { height: 75vh; }
      #metrics { padding: 0 1rem 1rem; }
      .aside-section { padding: 1rem 1rem 0; }
    }
  </style>
</head>
<body>

  <div class="pre-header">
    <div class="pre-header-brand">
      <img src="/static/img/logo-govco.png"
           alt="gov.co — Portal oficial del Estado colombiano">
    </div>
  </div>

  <header class="inst-header">
    <img src="/static/img/logo-ane.png"
         alt="Agencia Nacional del Espectro"
         class="logo-ane">
    <div class="inst-divider" aria-hidden="true"></div>
    <div class="inst-entity">
      <h1>Agencia Nacional del Espectro</h1>
      <p>Rep&uacute;blica de Colombia</p>
    </div>
  </header>

  <nav class="nav-bar" aria-label="Aplicaci&oacute;n">
    <a href="/" class="nav-link">&larr; Valoraci&oacute;n</a>
    <span class="nav-title">Traslape entre Proponentes</span>
    <span class="nav-badge">GeoSight V2.1</span>
  </nav>

  <div class="workspace">

    <aside>
      <div class="aside-section">
        <p class="section-title">Proponentes</p>

        <form id="overlap-form">

          <div class="proponent-block" id="block-a">
            <div class="proponent-label">Proponente A</div>
            <div class="coord-list" id="coords-a">
              <div class="coord-row">
                <div class="coord-header">
                  <span class="coord-label">Coordenada 1</span>
                </div>
                <div class="coords">
                  <div class="field">
                    <label>Latitud</label>
                    <input type="number" step="0.00001" class="coord-lat"
                           value="5.73" placeholder="5.73" required>
                  </div>
                  <div class="field">
                    <label>Longitud</label>
                    <input type="number" step="0.00001" class="coord-lng"
                           value="-73.05" placeholder="-73.05" required>
                  </div>
                </div>
                <div class="field" style="margin-top:.5rem;">
                  <label>Radio</label>
                  <select class="coord-radius">
                    <option value="8.2" selected>8.2 km</option>
                    <option value="21.9">21.9 km</option>
                    <option value="35.8">35.8 km</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="add-row">
              <button type="button" class="btn-add" onclick="addCoord('a')">+ Agregar coordenada</button>
              <span class="counter" id="counter-a">1 / 10</span>
            </div>
          </div>

          <div class="proponent-block b" id="block-b">
            <div class="proponent-label">Proponente B</div>
            <div class="coord-list" id="coords-b">
              <div class="coord-row">
                <div class="coord-header">
                  <span class="coord-label">Coordenada 1</span>
                </div>
                <div class="coords">
                  <div class="field">
                    <label>Latitud</label>
                    <input type="number" step="0.00001" class="coord-lat"
                           value="5.77" placeholder="5.77" required>
                  </div>
                  <div class="field">
                    <label>Longitud</label>
                    <input type="number" step="0.00001" class="coord-lng"
                           value="-73.02" placeholder="-73.02" required>
                  </div>
                </div>
                <div class="field" style="margin-top:.5rem;">
                  <label>Radio</label>
                  <select class="coord-radius">
                    <option value="8.2" selected>8.2 km</option>
                    <option value="21.9">21.9 km</option>
                    <option value="35.8">35.8 km</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="add-row">
              <button type="button" class="btn-add" onclick="addCoord('b')">+ Agregar coordenada</button>
              <span class="counter" id="counter-b">1 / 10</span>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="calc-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            Calcular traslape
          </button>

        </form>
      </div>

      <div class="divider"></div>

      <div id="metrics">
        <p class="metric-empty">
          Ingrese las coordenadas de ambos proponentes<br>
          y presione <strong>Calcular traslape</strong>.
        </p>
      </div>
    </aside>

    <div id="map-area">
      <div class="map-tabs" id="map-tabs" style="display:none;">
        <button class="map-tab active" data-view="a" onclick="switchView('a')">
          Vista Proponente A
        </button>
        <button class="map-tab" data-view="b" onclick="switchView('b')">
          Vista Proponente B
        </button>
      </div>
      <div id="map-spinner">
        <div class="spinner-ring"></div>
      </div>
      <div id="map-container">
        <iframe src="/map?lat=5.75&amp;lng=-73.035&amp;radius_km=8.2"
                style="border:none;" title="Mapa de traslape"></iframe>
      </div>
    </div>

  </div>

  <script>
    const MAX_POINTS = {{ max_points }};
    let mapHtmlA = null;
    let mapHtmlB = null;

    function copFormat(n) {
      return '$ ' + Math.round(n).toLocaleString('de-DE');
    }

    function switchView(view) {
      document.querySelectorAll('.map-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.view === view);
      });
      const html = view === 'a' ? mapHtmlA : mapHtmlB;
      if (html) {
        const container = document.getElementById('map-container');
        container.innerHTML = '';
        const frame = document.createElement('iframe');
        frame.setAttribute('sandbox', 'allow-scripts');
        frame.srcdoc = html;
        frame.style.cssText = 'width:100%;height:100%;border:none;';
        container.appendChild(frame);
      }
    }

    function addCoord(side) {
      const list = document.getElementById('coords-' + side);
      const rows = list.querySelectorAll('.coord-row');
      if (rows.length >= MAX_POINTS) return;
      const n = rows.length + 1;
      const row = document.createElement('div');
      row.className = 'coord-row';
      row.innerHTML =
        '<div class="coord-header">' +
          '<span class="coord-label">Coordenada ' + n + '</span>' +
          '<button type="button" class="btn-remove" onclick="removeCoord(this, \'' + side + '\')" title="Eliminar">&times;</button>' +
        '</div>' +
        '<div class="coords">' +
          '<div class="field"><label>Latitud</label><input type="number" step="0.00001" class="coord-lat" placeholder="lat" required></div>' +
          '<div class="field"><label>Longitud</label><input type="number" step="0.00001" class="coord-lng" placeholder="lng" required></div>' +
        '</div>' +
        '<div class="field" style="margin-top:.5rem;">' +
          '<label>Radio</label>' +
          '<select class="coord-radius"><option value="8.2" selected>8.2 km</option><option value="21.9">21.9 km</option><option value="35.8">35.8 km</option></select>' +
        '</div>';
      list.appendChild(row);
      updateCounters(side);
    }

    function removeCoord(btn, side) {
      const list = document.getElementById('coords-' + side);
      if (list.querySelectorAll('.coord-row').length <= 1) return;
      btn.closest('.coord-row').remove();
      renumberCoords(side);
      updateCounters(side);
    }

    function renumberCoords(side) {
      const rows = document.getElementById('coords-' + side).querySelectorAll('.coord-row');
      rows.forEach((row, i) => {
        row.querySelector('.coord-label').textContent = 'Coordenada ' + (i + 1);
        const removeBtn = row.querySelector('.btn-remove');
        if (i === 0 && rows.length === 1 && removeBtn) {
          removeBtn.remove();
        }
      });
    }

    function updateCounters(side) {
      const list = document.getElementById('coords-' + side);
      const n = list.querySelectorAll('.coord-row').length;
      document.getElementById('counter-' + side).textContent = n + ' / ' + MAX_POINTS;
      const block = document.getElementById('block-' + side);
      block.querySelector('.btn-add').disabled = n >= MAX_POINTS;
    }

    function collectPoints(side) {
      const rows = document.getElementById('coords-' + side).querySelectorAll('.coord-row');
      const pts = [];
      rows.forEach(row => {
        pts.push({
          lat: parseFloat(row.querySelector('.coord-lat').value),
          lng: parseFloat(row.querySelector('.coord-lng').value),
          radius_km: parseFloat(row.querySelector('.coord-radius').value),
        });
      });
      return pts;
    }

    document.getElementById('overlap-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('calc-btn');
      btn.disabled = true;
      document.getElementById('map-spinner').style.display = 'flex';

      const ptsA = collectPoints('a');
      const ptsB = collectPoints('b');

      let payload;
      if (ptsA.length === 1 && ptsB.length === 1) {
        payload = { point_a: ptsA[0], point_b: ptsB[0] };
      } else {
        payload = { points_a: ptsA, points_b: ptsB };
      }

      try {
        const res = await fetch('/v2/overlap', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const err = await res.json();
          alert(err.error || err.detail || 'Error al calcular traslape.');
          return;
        }

        const data = await res.json();
        renderOverlapResults(data, ptsA.length, ptsB.length);
      } catch (err) {
        alert('Error de red: ' + err.message);
      } finally {
        btn.disabled = false;
        document.getElementById('map-spinner').style.display = 'none';
      }
    });

    function renderOverlapResults(data, countA, countB) {
      const metrics = document.getElementById('metrics');
      const labelA = countA > 1 ? 'Cobertura A (' + countA + ' coordenadas)' : 'Cobertura A';
      const labelB = countB > 1 ? 'Cobertura B (' + countB + ' coordenadas)' : 'Cobertura B';

      if (!data.overlap_exists) {
        metrics.innerHTML =
          '<p class="section-title">Resultado</p>' +
          '<div class="no-overlap-msg">' +
            'No existe traslape geográfico entre los proponentes.<br>' +
            'Las coberturas no se intersectan con los radios seleccionados.' +
          '</div>' +
          '<div class="metric-grid" style="margin-top:1rem;">' +
            '<div class="metric-card proponent-a">' +
              '<div class="metric-label">' + labelA + '</div>' +
              '<div class="metric-value blue">' + copFormat(data.view_a.coverage.value) + '</div>' +
              '<div class="metric-note">' + data.view_a.coverage.population.toLocaleString('de-DE') + ' personas &middot; ' + data.view_a.coverage.polygon_count + ' polígonos</div>' +
            '</div>' +
            '<div class="metric-card proponent-b">' +
              '<div class="metric-label">' + labelB + '</div>' +
              '<div class="metric-value blue">' + copFormat(data.view_b.coverage.value) + '</div>' +
              '<div class="metric-note">' + data.view_b.coverage.population.toLocaleString('de-DE') + ' personas &middot; ' + data.view_b.coverage.polygon_count + ' polígonos</div>' +
            '</div>' +
          '</div>';
      } else {
        metrics.innerHTML =
          '<p class="section-title">Resultado</p>' +
          '<div class="metric-grid">' +
            '<div class="metric-card overlap-card">' +
              '<div class="metric-label">Traslape (A &cap; B)</div>' +
              '<div class="metric-value" style="color:#333;">' + copFormat(data.overlap.value) + '</div>' +
              '<div class="metric-note">' + data.overlap.population.toLocaleString('de-DE') + ' personas &middot; ' + data.overlap.polygon_count + ' polígonos</div>' +
            '</div>' +
            '<div class="metric-card proponent-a">' +
              '<div class="metric-label">' + labelA + '</div>' +
              '<div class="metric-value blue">' + copFormat(data.view_a.coverage.value) + '</div>' +
              '<div class="metric-note">' + data.view_a.coverage.population.toLocaleString('de-DE') + ' personas &middot; ' + data.view_a.coverage.polygon_count + ' polígonos</div>' +
            '</div>' +
            '<div class="metric-card proponent-b">' +
              '<div class="metric-label">' + labelB + '</div>' +
              '<div class="metric-value blue">' + copFormat(data.view_b.coverage.value) + '</div>' +
              '<div class="metric-note">' + data.view_b.coverage.population.toLocaleString('de-DE') + ' personas &middot; ' + data.view_b.coverage.polygon_count + ' polígonos</div>' +
            '</div>' +
          '</div>';
      }

      mapHtmlA = data.view_a.map_html;
      mapHtmlB = data.view_b.map_html;
      document.getElementById('map-tabs').style.display = 'flex';
      switchView('a');
    }
  </script>
