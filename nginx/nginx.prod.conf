# ---------------------------------------------------------------------------
# Rate limiting: max 10 req/s per IP; burst=20 sin delay para peticiones ligeras
# La zona "assignments_zone" aplica restricción estricta en POST /assignments
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=assignments:10m rate=5r/m;

upstream app {
    server app:8000;
}

server {
    listen 80;

    # Redirigir todo HTTP -> HTTPS en produccion
    # (Se asume que un load-balancer externo o Certbot termina TLS;
    #  si NGINX gestiona TLS directamente, usar listen 443 ssl y
    #  desactivar este server block de redireccion.)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;

    # --- TLS (completar rutas reales en prod) ---
    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Compression
    gzip on;
    gzip_types text/html application/json text/css;

    # Upload limit
    client_max_body_size 10m;

    # ---------------------------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS: el navegador forzara HTTPS durante 1 año, incluyendo subdominios
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # CSP ajustada al stack de Folium + Google Fonts + OpenStreetMap tiles
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; img-src 'self' data: https://*.tile.openstreetmap.org https://*.openstreetmap.org; frame-ancestors 'none';" always;

    # Static files served directly by NGINX — Python never touched
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Rate limit estricto solo para POST en /assignments (costoso computacionalmente)
    location = /assignments {
        limit_req zone=assignments burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Rate limit estricto para /assignments/multi (multi-punto, aun mas costoso)
    location = /assignments/multi {
        limit_req zone=assignments burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Rate limit estricto para endpoints v1
    location = /v1/assignments {
        limit_req zone=assignments burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /v1/assignments/multi {
        limit_req zone=assignments burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Rate limit estricto para endpoints v2
    location = /v2/assignments {
        limit_req zone=assignments burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /v2/assignments/multi {
        limit_req zone=assignments burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /v2/compare {
        limit_req zone=assignments burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /v2/overlap {
        limit_req zone=assignments burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Todo el resto: rate-limit general
    location / {
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Docker-friendly logging to stdout/stderr
    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
