# ---------------------------------------------------------------------------
# nginx.conf — development
# Rate limiting activo para detectar problemas antes de llegar a prod.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=general_dev:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=assignments_dev:10m rate=20r/m;

upstream app {
    server app:8000;
}

server {
    listen 80;

    # Static files served directly by NGINX — Python never touched
    location /static/ {
        alias /app/static/;
        expires 30d;
    }

    # Rate limit estricto solo para POST en /assignments
    location = /assignments {
        limit_req zone=assignments_dev burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Rate limit para /assignments/multi (multi-punto)
    location = /assignments/multi {
        limit_req zone=assignments_dev burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Everything else proxied to FastAPI
    location / {
        limit_req zone=general_dev burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Docker-friendly logging to stdout/stderr
    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
